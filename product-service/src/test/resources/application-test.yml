spring:
  # --- Base de datos en memoria para tests ---
  datasource:
    url: jdbc:h2:mem:product_test_db;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  # --- Desactivar dependencias externas ---
  cloud:
    config:
      enabled: false
  eureka:
    client:
      enabled: false
  
  # --- Desactivar RabbitMQ para que no intente conectar ---
  rabbitmq:
    listener:
      simple:
        auto-startup: false

  # --- Propiedad para seguridad (aunque la sobreescribimos con TestSecurityConfig) ---
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: "test-secret-key-for-product-service-that-is-long-enough"

logging:
  level:
    org.springframework.web: INFO
    com.celotts: INFO
    org.hibernate: WARN
