# --- Swagger / OpenAPI ---
swagger.purchase.api.name=API de Compras
swagger.purchase.api.desc=API para gestionar \u00F3rdenes de compra y su ciclo de vida
swagger.purchase.create.summary=Crear una nueva orden de compra
swagger.purchase.create.desc=Crea una nueva orden de compra. Valida la existencia del proveedor y los productos antes de la creaci\u00F3n.
swagger.purchase.receive.summary=Recibir una compra
swagger.purchase.receive.desc=Marca una compra como RECIBIDA y actualiza el stock en el servicio de productos.
swagger.purchase.get-by-id.summary=Obtener compra por ID
swagger.purchase.get-by-id.desc=Recupera los detalles de una orden de compra espec\u00EDfica por su identificador \u00FAnico.
swagger.purchase.list.summary=Listar todas las compras
swagger.purchase.list.desc=Recupera una lista paginada de \u00F3rdenes de compra. Soporta ordenamiento.
swagger.purchase.update.summary=Actualizar una compra
swagger.purchase.update.desc=Actualiza una orden de compra existente. Solo permite actualizaciones si la compra est\u00E1 en un estado modificable (ej. BORRADOR).
swagger.purchase.delete.summary=Eliminar una compra
swagger.purchase.delete.desc=Realiza un borrado l\u00F3gico de una orden de compra. El registro permanece en la base de datos pero se marca como eliminado.
swagger.purchase.ping.summary=Ping al servicio
swagger.purchase.ping.desc=Ping simple para verificar el estado del servicio.

