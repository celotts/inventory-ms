# --- Swagger / OpenAPI ---
swagger.purchase.api.name=Purchase API
swagger.purchase.api.desc=API for managing purchase orders and their lifecycle
swagger.purchase.create.summary=Create a new purchase order
swagger.purchase.create.desc=Creates a new purchase order. Validates the existence of the supplier and products before creation.
swagger.purchase.receive.summary=Receive a purchase
swagger.purchase.receive.desc=Marks a purchase as RECEIVED and updates the stock in the product service.
swagger.purchase.get-by-id.summary=Get purchase by ID
swagger.purchase.get-by-id.desc=Retrieves the details of a specific purchase order by its unique identifier.
swagger.purchase.list.summary=List all purchases
swagger.purchase.list.desc=Retrieves a paginated list of purchase orders. Supports sorting.
swagger.purchase.update.summary=Update a purchase
swagger.purchase.update.desc=Updates an existing purchase order. Only allows updates if the purchase is in a modifiable state (e.g., DRAFT).
swagger.purchase.delete.summary=Delete a purchase
swagger.purchase.delete.desc=Soft deletes a purchase order. The record remains in the database but is marked as deleted.
swagger.purchase.ping.summary=Ping service
swagger.purchase.ping.desc=Simple ping to check service status.

# --- Success Messages ---
