networks:
  inventory-net:
    driver: bridge
    name: inventory-net

services:
  # --- INFRAESTRUCTURA BASE ---
  rabbitmq:
    profiles: ["infra", "product", "purchase", "sales"]
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    ports: ["5672:5672", "15672:15672"]
    networks: { inventory-net: { aliases: [rabbitmq] } }
    user: rabbitmq # Ejecutar como usuario rabbitmq para permisos
    volumes: ["rabbitmq_data:/var/lib/rabbitmq"] # Volumen para persistencia y permisos
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    deploy:
      resources:
        limits:
          memory: 256M # Límite de memoria

  zipkin:
    profiles: ["infra", "product", "supplier", "auth", "sales", "tax", "purchase", "gateway"]
    image: openzipkin/zipkin
    container_name: zipkin
    ports: ["9411:9411"]
    networks: { inventory-net: { aliases: [zipkin] } }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M # Límite de memoria

  # --- BASES DE DATOS (Globales y con doble alias) ---
  db_product:
    profiles: ["product"]
    image: postgres:16
    container_name: db_product
    environment: { POSTGRES_DB: product, POSTGRES_USER: product, POSTGRES_PASSWORD: product123 }
    ports: ["5433:5432"]
    networks: { inventory-net: { aliases: [product-db] } }
    volumes: ["db_product_data:/var/lib/postgresql/data", "./init-scripts/product/01-product-init.sql:/docker-entrypoint-initdb.d/01-product-init.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product -d product"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M # Límite de memoria

  db_supplier:
    profiles: ["supplier"]
    image: postgres:16
    container_name: db_supplier
    environment: { POSTGRES_DB: supplier, POSTGRES_USER: supplier, POSTGRES_PASSWORD: supplier123 }
    ports: ["5434:5432"]
    networks: { inventory-net: { aliases: [supplier-db] } }
    volumes: ["db_supplier_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplier -d supplier"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M # Límite de memoria

  db_purchase:
    profiles: ["purchase"]
    image: postgres:16
    container_name: db_purchase
    environment: { POSTGRES_DB: purchase, POSTGRES_USER: purchase, POSTGRES_PASSWORD: purchase123 }
    ports: ["5436:5432"]
    networks: { inventory-net: { aliases: [purchase-db] } }
    volumes: ["db_purchase_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purchase -d purchase"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M # Límite de memoria

  db_tax:
    profiles: ["tax"]
    image: postgres:16
    container_name: db_tax
    environment: { POSTGRES_DB: tax, POSTGRES_USER: tax, POSTGRES_PASSWORD: tax123 }
    ports: ["5435:5432"]
    networks: { inventory-net: { aliases: [tax-db] } }
    volumes: ["db_tax_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tax -d tax"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M # Límite de memoria

  db_auth:
    profiles: ["auth"]
    image: postgres:16
    container_name: db_auth
    environment: { POSTGRES_DB: auth, POSTGRES_USER: auth_user, POSTGRES_PASSWORD: auth_pass }
    ports: ["5437:5432"]
    networks: { inventory-net: { aliases: [auth-db] } }
    volumes: ["db_auth_data:/var/lib/postgresql/data", "./init-scripts/auth/05-auth-init.sql:/docker-entrypoint-initdb.d/05-auth-init.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M # Límite de memoria

  db_sales:
    profiles: ["sales"]
    image: postgres:16
    container_name: db_sales
    environment: { POSTGRES_DB: sales, POSTGRES_USER: sales_user, POSTGRES_PASSWORD: sales_pass }
    ports: ["5438:5432"]
    networks: { inventory-net: { aliases: [sales-db] } }
    volumes: ["db_sales_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_user -d sales"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M # Límite de memoria

  # --- CORE SERVICES ---
  discovery-service:
    profiles: ["infra"]
    container_name: discovery-service
    image: discovery-service:latest
    build: { context: ../, dockerfile: discovery-service/Dockerfile.local }
    ports: ["8761:8761"]
    networks: { inventory-net: { aliases: [discovery-service] } }
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 0"] # Relajado para no bloquear
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      JAVA_OPTS: "-Xmx256m -Xms128m" # Reducido
    deploy:
      resources:
        limits:
          memory: 384M # Límite de memoria

  config-service:
    profiles: ["infra"]
    container_name: config-service
    image: config-service:latest
    build: { context: ../, dockerfile: config-service/Dockerfile.local }
    ports: ["7777:7777"]
    environment:
        SPRING_PROFILES_ACTIVE: docker,native
        SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo-local/
        JAVA_OPTS: "-Xmx256m -Xms128m" # Reducido
    volumes: ["../config-repo-local:/config-repo-local:ro"]
    networks: { inventory-net: { aliases: [config-service] } }
    depends_on: [discovery-service]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7777/actuator/health || exit 0"] # Relajado para no bloquear
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M # Límite de memoria

  # --- MICROSERVICIOS ---
  product-service:
    profiles: ["product"]
    container_name: product-service
    image: product-service:latest
    build: { context: ../, dockerfile: product-service/Dockerfile.local }
    ports: ["9090:9090"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://product-db:5432/product
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:7777
      SPRING_RABBITMQ_HOST: rabbitmq
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      JAVA_OPTS: "-Xmx384m -Xms192m" # Reducido
    networks: [inventory-net]
    depends_on:
      db_product: { condition: service_healthy }
      config-service: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      zipkin: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 512M # Límite de memoria

  supplier-service:
    profiles: ["supplier"]
    container_name: supplier-service
    image: supplier-service:latest
    build: { context: ../, dockerfile: supplier-service/Dockerfile.local }
    ports: ["9091:9091"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://supplier-db:5432/supplier
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:7777
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      JAVA_OPTS: "-Xmx384m -Xms192m" # Reducido
    networks: [inventory-net]
    depends_on:
      db_supplier: { condition: service_healthy }
      config-service: { condition: service_healthy }
      zipkin: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 512M # Límite de memoria

  auth-service:
    profiles: ["auth"]
    container_name: auth-service
    image: auth-service:latest
    build: { context: ../, dockerfile: auth-service/Dockerfile.local }
    ports: ["8081:8081"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/auth
      JWT_SECRET: ======================CelottsJWTSecretDefaultDevKey===========================
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:7777
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      JAVA_OPTS: "-Xmx384m -Xms192m" # Reducido
    networks: [inventory-net]
    depends_on:
      db_auth: { condition: service_healthy }
      config-service: { condition: service_healthy }
      zipkin: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 512M # Límite de memoria

  sales-service:
    profiles: ["sales"]
    container_name: sales-service
    image: sales-service:latest
    build: { context: ../, dockerfile: sales-service/Dockerfile.local }
    ports: ["8086:8086"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://sales-db:5432/sales
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:7777
      SPRING_RABBITMQ_HOST: rabbitmq
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      JAVA_OPTS: "-Xmx384m -Xms192m" # Reducido
    networks: [inventory-net]
    depends_on:
      db_sales: { condition: service_healthy }
      config-service: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      zipkin: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 512M # Límite de memoria

  tax-service:
    profiles: ["tax"]
    container_name: tax-service
    image: tax-service:latest
    build: { context: ../, dockerfile: tax-service/Dockerfile.local }
    ports: ["9093:9093"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://tax-db:5432/tax
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:7777
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      JAVA_OPTS: "-Xmx384m -Xms192m" # Reducido
    networks: [inventory-net]
    depends_on:
      db_tax: { condition: service_healthy }
      config-service: { condition: service_healthy }
      zipkin: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 512M # Límite de memoria

  purchase-service:
    profiles: ["purchase"]
    container_name: purchase-service
    image: purchase-service:latest
    build: { context: ../, dockerfile: purchase-service/Dockerfile.local }
    ports: ["9094:9094"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://purchase-db:5432/purchase
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:7777
      SPRING_RABBITMQ_HOST: rabbitmq
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      JAVA_OPTS: "-Xmx384m -Xms192m" # Reducido
    networks: [inventory-net]
    depends_on:
      db_purchase: { condition: service_healthy }
      config-service: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      zipkin: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 512M # Límite de memoria

  api-gateway:
    profiles: ["gateway"]
    container_name: api-gateway
    image: api-gateway:latest
    build: { context: ../, dockerfile: api-gateway/Dockerfile.local }
    ports: ["8090:8090"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:7777
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      JAVA_OPTS: "-Xmx512m -Xms256m" # Reducido
    networks: [inventory-net]
    depends_on:
      discovery-service: { condition: service_healthy }
      config-service: { condition: service_healthy }
      zipkin: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 768M # Límite de memoria

volumes:
  db_product_data:
  db_supplier_data:
  db_purchase_data:
  db_tax_data:
  db_auth_data:
  db_sales_data:
  rabbitmq_data:
